
name: Extract BurmalTime ZIP

on:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir extracted
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          unzip -q "$ZIP" -d extracted

          ROOT=$(find extracted -name package.json -type f | head -n 1 | xargs dirname)

          if [ -z "$ROOT" ]; then
            echo "package.json not found"
            exit 1
          fi

          cp -a "$ROOT"/. .

          rm -rf extracted
          rm -f "$ZIP"

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract BurmalTime project" || exit 0
          git push
          
